name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
    # A push of a v*.*.* tag also triggers a build — the resulting
    # signed APKs are then automatically published as a GitHub Release
    # marked latest (see the "Publish GitHub Release" step below).
    tags:
      - 'v*'
  # Run the APK build on PRs targeting master so each change to the
  # build pipeline (e.g. AndroidLibXrayLite submodule bumps, libv2ray
  # build steps, NDK upgrades) is verified before merge instead of
  # discovered after.
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4.0.1
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '13114758'
        packages: 'platforms;android-36.1 build-tools;36.1.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;28.2.13676358"
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "28.2.13676358"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    # Replaces the upstream "download libv2ray.aar from 2dust release"
    # path with an in-tree gomobile build from this fork's submodule.
    # Reasons:
    #   - The fork's submodule (sevaktigranyan305-netizen/AndroidLibXrayLite)
    #     pins a custom xray-core (sevaktigranyan305-netizen/Xray-core) via
    #     a go.mod replace directive, so a stock 2dust-built .aar would
    #     ship the wrong xray binary and miss the L3 virtual-network
    #     features this fork needs.
    #   - Building from source removes the dependency on the submodule
    #     having a published release tag — every commit on the submodule
    #     produces a fresh .aar without manual tagging.
    - name: Setup Go for libv2ray build
      uses: actions/setup-go@v6
      with:
        go-version-file: AndroidLibXrayLite/go.mod

    - name: Build libv2ray.aar from AndroidLibXrayLite submodule
      env:
        ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
      run: |
        # gomobile bind needs the submodule's vendored xray assets
        # (geosite/geoip dat files) staged into ./assets so they end up
        # baked into the .aar — the same step the AndroidLibXrayLite CI
        # runs locally before the bind.
        pushd AndroidLibXrayLite
        mkdir -p assets data
        bash gen_assets.sh download
        cp -v data/*.dat assets/
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH=$PATH:$(go env GOPATH)/bin
        gomobile init
        go mod tidy
        gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid=' ./
        popd
        mkdir -p V2rayNG/app/libs
        cp -v AndroidLibXrayLite/libv2ray.aar V2rayNG/app/libs/libv2ray.aar

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    # Keystore is only required when we want a signed, distributable APK
    # (push to master, manual workflow_dispatch with a release_tag, or
    # any push to master). PRs against master should validate the build
    # pipeline without needing access to the signing secrets — fork
    # repos may not have APP_KEYSTORE_BASE64 set yet, and that should
    # not block PR CI.
    - name: Decode Keystore
      if: env.APP_KEYSTORE_BASE64 != ''
      uses: timheuer/base64-to-file@v1.2.4
      id: android_keystore
      env:
        APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build APK
      env:
        KEYSTORE_PATH: ${{ steps.android_keystore.outputs.filePath }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport
        if [ -n "${KEYSTORE_PATH}" ]; then
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${KEYSTORE_PATH} \
            -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}
        else
          # No keystore available (fork PR / unconfigured fork): build
          # unsigned APKs so the pipeline still validates end-to-end.
          ./gradlew assembleRelease
        fi
    
    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

    # Publish a GitHub Release when the build was triggered by a
    # v*.*.* tag push (or by workflow_dispatch with release_tag set)
    # and all APKs are successfully signed. The release is marked
    # "latest", not prerelease, so end users see it prominently on
    # the repo home page and can `x-ui update`-style pull it.
    - name: Publish GitHub Release
      if: |
        success() && env.APP_KEYSTORE_BASE64 != '' && (
          startsWith(github.ref, 'refs/tags/v') ||
          github.event.inputs.release_tag != ''
        )
      env:
        APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
      uses: svenstaro/upload-release-action@v2
      with:
        file: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*.apk
        tag: ${{ github.event.inputs.release_tag || github.ref_name }}
        file_glob: true
        prerelease: false
        make_latest: true
        overwrite: true
